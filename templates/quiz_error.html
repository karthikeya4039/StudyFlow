{% extends "layout.html" %}

{% block content %}

<main class="page-container quiz-error-page">

    <div class="quiz-error-container reveal">

        <div class="card quiz-error-card">

            <div class="quiz-error-icon">⚠️</div>

            <h2 class="serif-heading quiz-error-title">
                Quiz <em>Generation Failed</em>
            </h2>

            <p class="quiz-error-message">
                {{ message }}
            </p>

            <div class="quiz-error-actions">

                <a href="{{ url_for('quiz') }}" class="btn-primary">
                    Try Again
                </a>

                <a href="{{ url_for('dashboard') }}" class="btn-secondary">
                    Dashboard
                </a>

            </div>

            <div class="quiz-error-help">

                <p>
                    MAKE SURE OLLAMA IS RUNNING:
                    <br>
                    <strong>ollama serve</strong>
                    <br><br>

                    AND LLAMA3.2 IS INSTALLED:
                    <br>
                    <strong>ollama pull llama3.2</strong>
                </p>

            </div>

        </div>

    </div>

</main>

{% endblock %}
